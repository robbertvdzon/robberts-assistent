# Container memory includes heap, metaspace, stacks and native buffers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robberts-assistent-backend
spec:
  template:
    spec:
      containers:
      - name: app
        resources:
          requests:
            memory: 288Mi
          limits:
            memory: 384Mi
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Xmx128m -XX:+UseSerialGC
