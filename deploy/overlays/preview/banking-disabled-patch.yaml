# Productie-banksleutels horen nooit in een preview/testpod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robberts-assistent-backend
spec:
  template:
    spec:
      containers:
      - name: app
        env:
        - name: RA_BANKING_APP_ID
          value: ''
        volumeMounts:
        - mountPath: /etc/banking
          $patch: delete
      volumes:
      - name: banking-key
        $patch: delete
