apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- sealed-secret-ai-access.yaml
patches:
- target:
    kind: SealedSecret
    name: robberts-assistent-secrets
  patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n\
    \  name: robberts-assistent-secrets"
- target:
    kind: Deployment
    name: robberts-assistent-backend
  patch: "- op: add\n  path: /spec/template/spec/containers/0/env\n  value:\n    -\
    \ name: RA_PREVIEW_SKIP_GOOGLE_AUTH\n      value: \"true\"\n    - name: RA_MOCK_AI\n\
    \      value: \"true\"\n    # Firebase leegmaken in preview \u2192 in-memory opslag,\
    \ zodat PR-previews niet naar\n    # de echte Firestore/Storage (prod-data) schrijven.\
    \ Overschrijft de via Reflector\n    # gemirrorde secret-waarde (expliciete env\
    \ wint van envFrom).\n    - name: RA_FIREBASE_PROJECT_ID\n      value: \"\"\n\
    # Minder strikt rollout-gedrag \u2014 preview spawn moet snel zijn (geen\n# PVC/Recreate-vereiste\
    \ hier, maar consistent met het personal-feed-patroon).\n- op: replace\n  path:\
    \ /spec/strategy\n  value:\n    type: RollingUpdate"
- target:
    kind: Route
    name: robberts-assistent-frontend
  patch: "- op: remove\n  path: /spec/host"
- path: agent-access-patch.yaml
- target:
    kind: SealedSecret
    name: ai-access
  patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n\
    \  name: ai-access\n"
